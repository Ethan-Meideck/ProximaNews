<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes favoris - Proxima News</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <main>
        <div class="container mt-4">

            <!-- Titre + boutons -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h4 class="mb-0">⭐ Mes articles favoris</h4>
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-secondary btn-sm" id="btnToggleJSON">{ } Voir le JSON</button>
                    <button class="btn btn-outline-primary btn-sm" id="btnExportJSON">
                        <i class="bi bi-download"></i> Télécharger JSON
                    </button>
                    <button class="btn btn-outline-danger btn-sm" id="btnViderFavoris">
                        <i class="bi bi-trash"></i> Tout supprimer
                    </button>
                </div>
            </div>

            <!-- Viewer JSON (masqué par défaut) -->
            <div id="jsonPanel" style="display:none" class="mb-4">
                <div class="card border-secondary">
                    <div class="card-header bg-dark text-white d-flex justify-content-between">
                        <span><i class="bi bi-braces"></i> favoris.json — contenu actuel</span>
                        <small class="text-muted">Stocké dans localStorage</small>
                    </div>
                    <pre id="jsonViewer" class="card-body bg-dark text-success mb-0"
                         style="max-height:300px; overflow-y:auto; font-size:0.78rem"></pre>
                </div>
            </div>

            <!-- Message si aucun favori -->
            <div id="aucunFavori" class="text-center text-muted py-5" style="display:none">
                <i class="bi bi-star fs-1"></i>
                <p class="mt-3">Aucun article en favori.<br>Ajoutez des articles depuis la page d'accueil.</p>
                <a href="../index.html" class="btn btn-primary mt-2">Retour à l'accueil</a>
            </div>

            <!-- Grille des favoris -->
            <div class="row" id="favoris_section"></div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../JavaScript/auth.js"></script>
    <script type="module" src="../JavaScript/header.js"></script>
    <script src="../JavaScript/favorites.js"></script>
    <script src="../JavaScript/footer.js"></script>
</body>
</html>
